# Paisley & District Draft
league_id: 27214
entry_id: 141674

# Leave blank to use every gameweek the API publishes fixtures for, which is
# a rolling window of about three. A number here trims it shorter.
horizon:

# Ignore free agents below this many minutes. They project at little more than
# the position baseline anyway, and including them makes the run slower for no
# useful output.
min_minutes: 45

# Discard claims worth less than this across the horizon, and keep at most
# this many. Claims sharing a drop are alternatives, not additions, so only
# a couple of fallbacks per drop are kept.
min_gain: 0.4
max_claims: 8
max_per_drop: 2

# How much to trust each signal. Must sum to 1.
#   season      points per game so far. Stable, slow to react.
#   form        last few gameweeks. Fast, noisy.
#   underlying  xGI per 90. Leads actual returns, catching players about to
#               come good before the points show up.
weights:
  season: 0.35
  form: 0.30
  underlying: 0.35

# Points per expected goal involvement, by position. Blended rates rather than
# pure goal values, since assists are flat at three for everyone.
xgi_to_points:
  GKP: 4.0
  DEF: 5.0
  MID: 4.5
  FWD: 4.0

# Baseline for turning up and playing an hour.
appearance_points: 2.0

# Starts needed before a player's own rate is trusted over the baseline.
# Higher is more sceptical of hot starts.
shrinkage_starts: 5

# What an unremarkable starter in each position returns per appearance.
position_baseline:
  GKP: 3.0
  DEF: 3.2
  MID: 3.3
  FWD: 3.4

# How far each position swings on the opposition. Defenders live and die by
# clean sheets, so they feel opposition quality more than forwards do.
fdr_swing:
  GKP: 0.35
  DEF: 0.35
  MID: 0.22
  FWD: 0.18

# Fixture adjustment is clamped to this range, and shrunk toward neutral until
# this many gameweeks have been played.
fdr_floor: 0.6
fdr_ceiling: 1.4
fdr_confidence_gws: 6

# Applied to players flagged doubtful where no percentage is given.
doubtful_penalty: 0.5

# Per-gameweek history. Availability is estimated from the last
# `recency_window` gameweeks, each older one worth `recency_decay` times the
# next. At 0.5 over five gameweeks the most recent is worth sixteen times the
# oldest, so a player who has just won or lost his place is reflected almost
# immediately rather than being averaged away across a season.
#
# Starts drive the estimate rather than minutes, because a striker who starts
# every week and comes off on the hour is a certain starter, not a 60% one.
# Minutes act as a floor so regular substitutes are not valued at zero.
recency_window: 5
recency_decay: 0.5

# Decay by position, overriding recency_decay above.
#
# Goalkeeper is deliberately much sharper. The position is close to binary:
# a keeper is either first choice or he is not, and once a manager hands over
# the gloves they tend to stay handed over. A keeper who has started the last
# two games is the number one, and what happened before the change tells you
# very little. Outfielders are genuinely rotated, so their history is worth
# more.
recency_decay_by_position:
  GKP: 0.20
  DEF: 0.50
  MID: 0.50
  FWD: 0.50
