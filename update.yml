name: Update waivers

on:
  schedule:
    # 06:00 UTC daily. Deliberately not weekly: a gameweek can finish on a
    # Monday night, and a Saturday snapshot taken mid-gameweek is built on
    # partial minutes, which quietly skews every projection.
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "template/**"
      - "config.yml"
      - ".github/workflows/update.yml"

# Only one run at a time, and let a newer one win rather than queueing up
# behind a stale build.
concurrency:
  group: waivers
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: |
          python tests/smoke.py
          python tests/build_offline.py

      - name: Build
        run: python src/build.py --config config.yml --template template/waiver-wire.html --out-dir docs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "nothing changed this run"
          else
            git commit -m "waivers: $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
